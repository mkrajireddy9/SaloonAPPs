services:
  postgres:
    image: postgres:16-alpine
    container_name: halo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: halo
      POSTGRES_PASSWORD: halo
      POSTGRES_DB: halo
    ports:
      - "5432:5432"
    volumes:
      - halo_pgdata:/var/lib/postgresql/data

volumes:
  halo_pgdata:
