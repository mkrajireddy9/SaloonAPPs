services:
  - type: web
    name: halo-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PLATFORM_ADMIN_TEST_LOGIN
        value: "true"
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: ALLOW_EMPTY_LOGIN
        value: "false"
      - key: EMAIL_REMINDERS_ENABLED
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_API_VERSION
        value: v27.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_APPOINTMENT_TEMPLATE
        value: hello_world
      - key: WHATSAPP_APPOINTMENT_TEMPLATE_LANGUAGE
        value: en_US
      - key: WHATSAPP_APPOINTMENT_TEMPLATE_VARIABLES
        value: "false"
  - type: web
    name: halo-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build --workspace frontend
    startCommand: npm run start --workspace frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
